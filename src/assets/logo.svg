<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6D5BFF"/>
      <stop offset="0.52" stop-color="#C13FE0"/>
      <stop offset="1" stop-color="#FF6A7A"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE3F1"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7CF6FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2B0A55" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Disk platter -->
  <circle cx="512" cy="540" r="238" fill="#FFFFFF" fill-opacity="0.10"/>
  <circle cx="512" cy="540" r="238" fill="none" stroke="url(#ring)" stroke-width="44" stroke-opacity="0.95"/>
  <circle cx="512" cy="540" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10" stroke-dasharray="4 26" stroke-linecap="round"/>
  <!-- Cleaning sweep arc -->
  <path d="M 322 686 A 238 238 0 0 1 300 430" fill="none" stroke="url(#sweep)" stroke-width="44" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="512" cy="540" r="62" fill="#FFFFFF"/>
  <circle cx="512" cy="540" r="22" fill="#C13FE0"/>

  <!-- Sparkles -->
  <path d="M 736 238 C 746 300 758 312 820 322 C 758 332 746 344 736 406 C 726 344 714 332 652 322 C 714 312 726 300 736 238 Z" fill="#FFFFFF" filter="url(#glow)"/>
  <path d="M 822 432 C 826 456 832 462 856 466 C 832 470 826 476 822 500 C 818 476 812 470 788 466 C 812 462 818 456 822 432 Z" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
