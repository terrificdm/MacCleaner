[package]
name = "maccleaner"
version = "0.1.0"
description = "Disk cleaner and app uninstaller for macOS"
authors = ["terrificdm"]
license = "MIT"
repository = "https://github.com/terrificdm/MacCleaner"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maccleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12.0"
plist = "1.10.1"
libc = "0.2.189"
dirs = "7.0.0"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL", "NSFileManager", "NSError", "NSArray", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGImage"] }
unicode-normalization = "0.1.25"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2", features = ["macos-private-api", "test"] }
